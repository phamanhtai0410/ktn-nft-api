deploy-prod-server1:
  stage: deploy
  image: docker:19.03.1
  services:
    - docker:19.03.1-dind
  tags:
    - esol-stag
  before_script:
    - apk add openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_PROD_SERVER_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 400 ~/.ssh/id_rsa
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -H $PROD_SERVER_1_IP >> ~/.ssh/known_hosts
  script:
    - sed -i -e "s#\[IMAGE_REPO\]#$FULLREPO_ASIA_PROD#g" docker-compose.yml 
    - scp docker-compose.yml  root@${PROD_SERVER_1_IP}:/data/cicd/ktn-nft-api/docker-compose.yml 
    - ssh root@$PROD_SERVER_1_IP "docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}"
    - ssh root@$PROD_SERVER_1_IP "cd /data/cicd/ktn-nft-api/ && docker-compose up --build -d"
  only:
    - master